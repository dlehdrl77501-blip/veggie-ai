import sqlite3
import pandas as pd

conn = sqlite3.connect("veggie_ai.db")
cursor = conn.cursor()

# 테이블 생성
cursor.execute("""
CREATE TABLE IF NOT EXISTS Vegetables (
    id INTEGER PRIMARY KEY,
    name_ko TEXT NOT NULL,
    name_en TEXT NOT NULL,
    category TEXT,
    image_url TEXT
);
""")
cursor.execute("""
CREATE TABLE IF NOT EXISTS Nutrients (
    id INTEGER PRIMARY KEY,
    vegetable_id INTEGER NOT NULL,
    nutrient_name TEXT NOT NULL,
    amount_per_100g REAL NOT NULL,
    unit TEXT NOT NULL,
    nutrient_type TEXT,
    FOREIGN KEY (vegetable_id) REFERENCES Vegetables(id)
);
""")
cursor.execute("""
CREATE TABLE IF NOT EXISTS HealthEffects (
    id INTEGER PRIMARY KEY,
    nutrient_name TEXT NOT NULL,
    health_effect TEXT NOT NULL,
    scientific_source TEXT
);
""")
cursor.execute("""
CREATE TABLE IF NOT EXISTS FlavorProfile (
    vegetable_id INTEGER PRIMARY KEY,
    sweetness INTEGER DEFAULT 0,
    bitterness INTEGER DEFAULT 0,
    earthiness INTEGER DEFAULT 0,
    water_content REAL,
    FOREIGN KEY (vegetable_id) REFERENCES Vegetables(id)
);
""")
conn.commit()

# CSV → DB 삽입
pd.read_csv("vegetables.csv").to_sql("Vegetables", conn, if_exists="replace", index=False)
pd.read_csv("nutrients.csv").to_sql("Nutrients", conn, if_exists="replace", index=False)
pd.read_csv("health_effects.csv").to_sql("HealthEffects", conn, if_exists="replace", index=False)
pd.read_csv("flavor_profile.csv").to_sql("FlavorProfile", conn, if_exists="replace", index=False)

conn.commit()
conn.close()
print("CSV 데이터가 veggie_ai.db에 성공적으로 입력되었습니다.") 

